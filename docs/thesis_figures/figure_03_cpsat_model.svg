<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52657B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#15304A" flood-opacity="0.10"/></filter></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="72" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#15243A" text-anchor="start">CP-SAT Subsystem Selection Model</text><text x="72" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52657B" text-anchor="start">Finite-domain optimization with discrete design variables, coupled engineering constraints, and explainable outputs</text><line x1="72" y1="132" x2="1528" y2="132" stroke="#B8C5D3"/><rect x="72" y="158" width="102" height="34" rx="17" fill="#E8F2FA"/><text x="123" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1769AA" text-anchor="middle">INPUTS</text><g filter="url(#shadow)"><rect x="72" y="205" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="72" y="205" width="7" height="150" rx="3.5" fill="#1769AA"/></g><text x="96" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Mission requirements</text><text x="96" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="96" dy="0">Payload mass, volume and power</tspan><tspan x="96" dy="24">Data, pointing and thermal needs</tspan><tspan x="96" dy="24">Orbit and user preferences</tspan></text><g filter="url(#shadow)"><rect x="72" y="385" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="72" y="385" width="7" height="150" rx="3.5" fill="#1769AA"/></g><text x="96" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Engineering data</text><text x="96" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="96" dy="0">Bus capacity library</tspan><tspan x="96" dy="24">Subsystem tier libraries</tspan><tspan x="96" dy="24">Compatibility and assumptions</tspan></text><g filter="url(#shadow)"><rect x="72" y="565" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="72" y="565" width="7" height="150" rx="3.5" fill="#1769AA"/></g><text x="96" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Model parameters</text><text x="96" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="96" dy="0">Margins and efficiencies</tspan><tspan x="96" dy="24">Integer scaling coefficients</tspan><tspan x="96" dy="24">Cost and risk weights</tspan></text><path d="M372 280 L455 280" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M372 460 L455 460" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M372 640 L455 640" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="455" y="175" width="710" height="590" rx="20" fill="#F4F7FA" stroke="#008A83" stroke-width="2.5"/><text x="490" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#15243A" text-anchor="start">OR-Tools CP-SAT model</text><g filter="url(#shadow)"><rect x="490" y="250" width="300" height="175" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="490" y="250" width="7" height="175" rx="3.5" fill="#008A83"/></g><text x="514" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Decision variables</text><text x="514" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="514" dy="0">One bus class:  bᵤ ∈ {0,1}</tspan><tspan x="514" dy="24">One tier per subsystem:  yₛ,ₖ</tspan><tspan x="514" dy="24">EPS · ADCS · COMMS · OBC</tspan><tspan x="514" dy="24">THERMAL · PROPULSION</tspan></text><g filter="url(#shadow)"><rect x="830" y="250" width="300" height="175" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="830" y="250" width="7" height="175" rx="3.5" fill="#008A83"/></g><text x="854" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Selection constraints</text><text x="854" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="854" dy="0">Σ bᵤ = 1</tspan><tspan x="854" dy="24">Σ yₛ,ₖ = 1 for each subsystem</tspan><tspan x="854" dy="24">Tier compatibility masks</tspan><tspan x="854" dy="24">Bus-range compatibility</tspan></text><g filter="url(#shadow)"><rect x="490" y="465" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="490" y="465" width="7" height="230" rx="3.5" fill="#D97706"/></g><text x="514" y="502" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Coupled hard constraints</text><text x="514" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="514" dy="0">Volume  Utotal ≤ Uusable</tspan><tspan x="514" dy="24">Mass  Mtotal ≤ Mdry,max</tspan><tspan x="514" dy="24">Average and peak power closure</tspan><tspan x="514" dy="24">Storage and downlink capacity</tspan><tspan x="514" dy="24">Pointing, thermal and propulsion</tspan><tspan x="514" dy="24">Battery / solar / radiator limits</tspan></text><g filter="url(#shadow)"><rect x="830" y="465" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="830" y="465" width="7" height="230" rx="3.5" fill="#D97706"/></g><text x="854" y="502" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Optimization objective</text><text x="854" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="854" dy="0">Weighted, integer-scaled score</tspan><tspan x="854" dy="24">Minimize cost, mass and risk</tspan><tspan x="854" dy="24">Penalize excess capability</tspan><tspan x="854" dy="24">Respect user optimization priority</tspan><tspan x="854" dy="24">Return infeasible status if no</tspan><tspan x="854" dy="24">combination satisfies all constraints</tspan></text><path d="M790 337 L830 337" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M640 425 L640 465" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M980 425 L980 465" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1165 470 L1245 470" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1245" y="158" width="117" height="34" rx="17" fill="#F0ECFA"/><text x="1303.5" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6D4CC3" text-anchor="middle">OUTPUTS</text><g filter="url(#shadow)"><rect x="1245" y="205" width="283" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="1245" y="205" width="7" height="150" rx="3.5" fill="#6D4CC3"/></g><text x="1269" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Selected architecture</text><text x="1269" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1269" dy="0">Bus class</tspan><tspan x="1269" dy="24">Subsystem tiers</tspan><tspan x="1269" dy="24">Optional components</tspan></text><g filter="url(#shadow)"><rect x="1245" y="385" width="283" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="1245" y="385" width="7" height="150" rx="3.5" fill="#6D4CC3"/></g><text x="1269" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Budget closure</text><text x="1269" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1269" dy="0">Total mass and power</tspan><tspan x="1269" dy="24">Indicative cost</tspan><tspan x="1269" dy="24">Residual margins</tspan></text><g filter="url(#shadow)"><rect x="1245" y="565" width="283" height="150" rx="14" fill="#FFFFFF" stroke="#B8C5D3" stroke-width="1.5"/><rect x="1245" y="565" width="7" height="150" rx="3.5" fill="#6D4CC3"/></g><text x="1269" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243A" text-anchor="start">Engineering evidence</text><text x="1269" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#52657B" text-anchor="start"><tspan x="1269" dy="0">Feasibility status</tspan><tspan x="1269" dy="24">Warnings</tspan><tspan x="1269" dy="24">Solver trace</tspan></text><path d="M1165 300 L1245 280" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1165 520 L1245 460" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1165 640 L1245 640" stroke="#52657B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="455" y="800" width="710" height="42" rx="21" fill="#E6F5F3"/><text x="810" y="827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#008A83" text-anchor="middle">Hard feasibility first; preference-based ranking second</text><text x="1528" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#52657B" text-anchor="end">Figure 3</text></svg>
