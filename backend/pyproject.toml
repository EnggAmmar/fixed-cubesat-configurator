[project]
name = "cubesat-design-configurator-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
  "ortools>=9.9",
  "reportlab>=4.0,<5.0",
  "jinja2>=3.1,<4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
